# Tide Mark — Capacitor iOS → TestFlight
# https://docs.codemagic.io/yaml-quick-start/building-an-ionic-app/
#
# Secrets stay in the Codemagic UI. This file only references the
# App Store Connect integration by its human-readable name:
#   integrations.app_store_connect: Tide Mark
# Create that key in Codemagic (Team integrations → Developer Portal)
# using an App Store Connect API key with App Manager access.
# See docs/app-store.md.

workflows:
  ios-testflight:
    name: Tide Mark iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Must match the App Store Connect API key name in Codemagic UI.
      app_store_connect: Tide Mark
    environment:
      # Fetches the Apple Distribution cert + App Store profile that were
      # generated or fetched in Codemagic Code signing identities using
      # the Tide Mark API key (bundle id com.tidemark.logbook).
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tidemark.logbook
      vars:
        BUNDLE_ID: com.tidemark.logbook
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        # App Store Connect Apple ID (General → App Information).
        APP_STORE_APPLE_ID: "6808864529"
      node: lts
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Sync Capacitor iOS
        script: |
          # Live WebView URL is already in capacitor.config.ts.
          npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios/App"
          LATEST_BUILD_NUMBER=""
          if ! LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID"); then
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || true)
          fi
          if [ -z "${LATEST_BUILD_NUMBER}" ]; then
            LATEST_BUILD_NUMBER=0
          fi
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
