# Tide Mark — Capacitor iOS → TestFlight
# https://docs.codemagic.io/yaml-quick-start/building-an-ionic-app/
# Signing (API key): https://docs.codemagic.io/yaml-code-signing/signing-ios/
# Publishing (env-var auth): https://docs.codemagic.io/yaml-publishing/app-store-connect/
#
# Personal (free) Codemagic account — do not create a Team (credit card,
# no free minutes). App Store Connect auth uses secret env vars in group
# `app_store_credentials` on the app’s Environment variables tab, not
# Team integrations → Developer Portal.
#
# Signing files are created/fetched at build time with
# `app-store-connect fetch-signing-files --create` (no Team, no manual .p12).
# The CLI authenticates with APP_STORE_CONNECT_ISSUER_ID,
# APP_STORE_CONNECT_KEY_IDENTIFIER, and APP_STORE_CONNECT_PRIVATE_KEY.
# --certificate-key=@env:CERTIFICATE_PRIVATE_KEY lets --create mint a new
# Apple Distribution cert whose private key Codemagic holds. Without it,
# fetch-signing-files fails if the account already has Distribution certs
# Codemagic cannot use: "Cannot save Signing Certificates without
# certificate private key". Do not commit the key. If Apple is at the
# Distribution cert limit (3), revoke an unused iOS Distribution cert in
# developer.apple.com → Certificates before re-running.

workflows:
  ios-testflight:
    name: Tide Mark iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        # Create this group on the app’s Environment variables tab (Secret):
        #   APP_STORE_CONNECT_ISSUER_ID
        #   APP_STORE_CONNECT_KEY_IDENTIFIER
        #   APP_STORE_CONNECT_PRIVATE_KEY  (full .p8 contents)
        #   CERTIFICATE_PRIVATE_KEY        (PEM RSA private key, including
        #     BEGIN/END lines — used only to create a Distribution cert)
        - app_store_credentials
      vars:
        BUNDLE_ID: com.tidemark.logbook
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        # App Store Connect Apple ID (General → App Information).
        APP_STORE_APPLE_ID: "6808864529"
      node: lts
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Sync Capacitor iOS
        script: |
          # Live WebView URL is already in capacitor.config.ts.
          npx cap sync ios
          # cap sync rebuilds packageClassList from npm plugins only. The
          # StoreKit class lives in the app target, so add it or purchase
          # never reaches JavaScript. The storyboard also registers it.
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "ios/App/App/capacitor.config.json";
            const config = JSON.parse(readFileSync(path, "utf8"));
            const list = new Set(config.packageClassList ?? []);
            list.add("TideMarkStorePlugin");
            config.packageClassList = [...list];
            writeFileSync(path, JSON.stringify(config, null, "\t") + "\n");
          '
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          # API key from app_store_credentials (APP_STORE_CONNECT_* env vars).
          # --certificate-key is required so --create can mint a Distribution
          # cert Codemagic can actually sign with (CLI holds the matching key).
          # https://github.com/codemagic-ci-cd/cli-tools/blob/master/docs/app-store-connect/fetch-signing-files.md
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios/App"

          # Info.plist stores CFBundleShortVersionString as the literal
          # placeholder $(MARKETING_VERSION). The version tool prints that
          # placeholder and does not expand the Xcode setting.
          # Read the setting the Release archive actually uses.
          MARKETING=""
          if settings=$(xcodebuild \
            -workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -showBuildSettings); then
            MARKETING=$(printf '%s\n' "$settings" | awk '
              /^Build settings for action .* target App:/ { in_app = 1; next }
              /^Build settings for action / { in_app = 0 }
              in_app && /^[[:space:]]*MARKETING_VERSION = / {
                val = $0
                sub(/^[[:space:]]*MARKETING_VERSION = /, "", val)
                gsub(/[[:space:]]/, "", val)
                print val
                exit
              }
            ')
          fi
          if [ -z "${MARKETING}" ] || [ "${MARKETING}" = '$(MARKETING_VERSION)' ]; then
            MARKETING=$(awk '
              /^[[:space:]]*MARKETING_VERSION = / {
                val = $0
                sub(/^[[:space:]]*MARKETING_VERSION = /, "", val)
                sub(/;[[:space:]]*$/, "", val)
                if (val !~ /\$\(/) { print val; exit }
              }
            ' App.xcodeproj/project.pbxproj)
          fi
          echo "Resolved marketing version: ${MARKETING}"
          if [ "$MARKETING" != "2.0" ]; then
            echo "Expected marketing version 2.0, found ${MARKETING}"
            exit 1
          fi

          # Highest CFBundleVersion already uploaded, across every marketing
          # version. Build numbers are app-wide, so 2.0 must be above 1.0's 7.
          normalize_build() {
            local line
            line=$(printf '%s\n' "$1" | awk 'NF { last = $0 } END { print last }' | tr -d '[:space:]')
            if [[ "$line" =~ ^[0-9]+$ ]]; then
              printf '%s' "$line"
              return 0
            fi
            return 1
          }
          latest_build() {
            local sub="$1"
            local out="" num=""
            # Prefer the highest build across every version. If this CLI
            # does not support the flag, fall back to the unscoped query.
            if out=$(app-store-connect "$sub" "$APP_STORE_APPLE_ID" --all-versions); then
              if num=$(normalize_build "$out"); then
                printf '%s' "$num"
                return 0
              fi
            fi
            if out=$(app-store-connect "$sub" "$APP_STORE_APPLE_ID"); then
              if num=$(normalize_build "$out"); then
                printf '%s' "$num"
                return 0
              fi
            fi
            return 1
          }
          TF_BUILD=""
          AS_BUILD=""
          if ! TF_BUILD=$(latest_build get-latest-testflight-build-number); then
            echo "Could not read the latest TestFlight build number"
            TF_BUILD=""
          fi
          if ! AS_BUILD=$(latest_build get-latest-app-store-build-number); then
            echo "Could not read the latest App Store build number"
            AS_BUILD=""
          fi
          if [ -z "$TF_BUILD" ] && [ -z "$AS_BUILD" ]; then
            echo "Refusing to upload build 1; the latest store build number was not readable"
            exit 1
          fi
          if [ -z "$TF_BUILD" ]; then
            LATEST_BUILD_NUMBER=$AS_BUILD
          elif [ -z "$AS_BUILD" ]; then
            LATEST_BUILD_NUMBER=$TF_BUILD
          elif [ "$TF_BUILD" -ge "$AS_BUILD" ]; then
            LATEST_BUILD_NUMBER=$TF_BUILD
          else
            LATEST_BUILD_NUMBER=$AS_BUILD
          fi
          NEXT_BUILD=$((LATEST_BUILD_NUMBER + 1))
          # Build 12 is the 2.0 annual-product upload (PR #109, 3739bcd).
          # 14 is the next upload after the 3.1.2(c) paywall fix.
          # Keep the next upload at or above it when the store query returns an older number.
          MINIMUM_BUILD=14
          if [ "$NEXT_BUILD" -lt "$MINIMUM_BUILD" ]; then
            echo "Raising build ${NEXT_BUILD} to ${MINIMUM_BUILD}"
            NEXT_BUILD=$MINIMUM_BUILD
          fi
          echo "Latest TestFlight build ${TF_BUILD:-unavailable}, App Store build ${AS_BUILD:-unavailable}; next build is ${NEXT_BUILD} for marketing version ${MARKETING}"
          agvtool new-version -all "$NEXT_BUILD"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        # Personal-account auth: API key from app env group (not Team integration).
        # https://docs.codemagic.io/yaml-publishing/app-store-connect/
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  # Signed release bundle for Google Play. Does not upload to Play Console.
  # Create a Codemagic Android code signing identity named tidemark_upload
  # (upload keystore). The reference below pulls CM_KEYSTORE_PATH,
  # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, and CM_KEY_PASSWORD at build time.
  # Do not commit the keystore. Play App Signing stays on in Play Console;
  # this keystore is only the upload key.
  android-release:
    name: Tide Mark Android release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - tidemark_upload
      vars:
        PACKAGE_NAME: com.tidemark.logbook
      node: lts
      java: 21
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Build signed release AAB and APK
        script: |
          cd android
          # Codemagic exports PROJECT_BUILD_NUMBER / BUILD_NUMBER (there is no
          # CM_BUILD_NUMBER, which is why the first AAB came out as versionCode 1).
          # app/build.gradle also enforces a floor of 3.
          VERSION_CODE="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-3}}"
          echo "Android versionCode: $VERSION_CODE"
          ./gradlew bundleRelease assembleRelease -PVERSION_CODE="$VERSION_CODE"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
